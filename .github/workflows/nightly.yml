name: Nightly build & deploy

# DORMANT until the repo is public and Pages is enabled.
# The scheduled job is gated on the repo variable NIGHTLY_ENABLED == 'true'
# (Settings -> Secrets and variables -> Actions -> Variables). Until you set it,
# the schedule fires but the job skips — zero cost, nothing deploys.
# To go live: make the repo public, enable Pages (Source: GitHub Actions),
# then set repository variable NIGHTLY_ENABLED = true. See CLAUDE.md.

on:
  schedule:
    # 05:30 UTC — comfortably after the prior UTC day's adsb.lol prod release,
    # which historically publishes ~03:25 UTC. If it isn't up yet the run fails
    # (no data committed, issue opened) and the next night's catch-up retries it.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day to process (YYYY-MM-DD); blank = yesterday"
        required: false

permissions:
  contents: write     # commit new aggregates
  pages: write        # deploy Pages
  id-token: write     # Pages OIDC

# A new run PREEMPTS an in-progress one (was cancel-in-progress: false, which let
# a stuck/queued run hold the group so every new manual deploy queued behind it
# and got bounced). For a deploy the latest run should always win, so cancel the
# older one instead of blocking on it.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    # Gate: skip entirely unless explicitly enabled. Manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.NIGHTLY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # A hung data fetch shouldn't tie up the runner for the 6h default; the build
    # normally takes a few minutes. Fail fast so the next run can proceed.
    # 45, not 30: a catch-up night can process up to 1 + NIGHTLY_CATCHUP_DAYS days
    # at ~10 min each. An ordinary night still takes ~10 min.
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      ingest_rc: ${{ steps.ingest.outputs.rc }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Resolve target day
        id: day
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            echo "day=${{ github.event.inputs.day }}" >> "$GITHUB_OUTPUT"
          else
            echo "day=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          fi

      # The 2026-11-01 run found 13.3 GB free, under the 15 GB floor, paused, and
      # (before --require-ingest) still went green. Preinstalled SDKs we never use
      # hold well over 15 GB; drop them so one ~4 GB day has room. $0, ~1 min.
      - name: Free runner disk
        run: |
          df -h "${RUNNER_TEMP}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h "${RUNNER_TEMP}"

      # Idempotent: present days skip. --catchup also retries the previous
      # config.NIGHTLY_CATCHUP_DAYS days, so a missed night heals itself.
      # --require-ingest exits 4 (paused on low disk) or 5 (a day still missing).
      # Those two are deferred: whatever days did land still commit and deploy,
      # then the ingest-check job fails the run and notify-failure opens an issue.
      # Any other non-zero exit (a day raised) fails here, before any commit.
      - name: Process day (+ catch-up)
        id: ingest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m pipeline.backfill "${{ steps.day.outputs.day }}" \
            --catchup --require-ingest \
            --scratch "${RUNNER_TEMP}/dr_scratch"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 4 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi

      # site/assets/analysis/ is derived from data/ but lives under site/, so a
      # data-only commit leaves the methodology page reporting a stale day count
      # while the map reports the new one. That drift is invisible to the
      # pipeline and grows by a day every night, so rebuild here rather than
      # relying on someone noticing. Reads the committed dailies; no network.
      - name: Rebuild analysis assets (stats.json + figures)
        env:
          PYTHONPATH: .
        run: python -m analysis.analyze

      - name: Commit new aggregates
        id: commit
        run: |
          git config user.name  "deadreckoning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ content/*.json site/assets/analysis/ || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "data: nightly aggregate ${{ steps.day.outputs.day }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble Pages artifact (site + data + content)
        run: |
          rm -rf public && mkdir -p public
          cp -r site/* public/
          cp -r data public/data
          cp -r content public/content
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || vars.NIGHTLY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # A paused or zero-ingest night must not read as green. The build commits and
  # deploys whatever did land; this job then fails the run on the deferred exit.
  ingest-check:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the night left a day missing
        run: |
          case "${{ needs.build.outputs.ingest_rc }}" in
            0) echo "All days in the nightly window landed." ;;
            4) echo "::error::Backfill PAUSED on low runner disk; days were skipped. See the build log."; exit 1 ;;
            5) echo "::error::A day in the nightly window has no data (release not published or 0-hex). See [MISSING] in the build log."; exit 1 ;;
            *) echo "::error::Unexpected ingest exit '${{ needs.build.outputs.ingest_rc }}'."; exit 1 ;;
          esac

  # Failure isolation: if the build fails, prior committed data is untouched
  # (we only commit on success) and an issue is opened for visibility.
  notify-failure:
    needs: [build, deploy, ingest-check]
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.ingest-check.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly build failed: ${new Date().toISOString().slice(0,10)}`,
              body: `The nightly build/deploy failed. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
